# Build the VitePress site and publish it to GitHub Pages on every push to main
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for "마지막 수정" dates
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build with VitePress
        run: npm run docs:build
      - name: List pages changed since the live site
        continue-on-error: true # search engine pings must never block a deploy
        run: node scripts/indexnow.mjs list
      - name: Keep the changed page list for the indexnow job
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.json
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Get the changed page list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Tell search engines
        run: node scripts/indexnow.mjs send
